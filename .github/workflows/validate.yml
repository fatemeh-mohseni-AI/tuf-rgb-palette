name: Validate RGB Palette

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test effects without hardware
        run: python3 -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests

      - name: Check embedded website JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (scripts.length !== 1) throw new Error('Expected exactly one inline script');
          new vm.Script(scripts[0][1], {filename: 'index.html'});
          console.log('JavaScript syntax valid');
          NODE

      - name: Check Zsh script syntax
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y zsh
          zsh -n keyboard-colors.zsh
