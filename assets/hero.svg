<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">TUF RGB Palette</title>
<desc id="desc">A glowing violet, aqua and pink keyboard and the title TUF RGB Palette on a dark gradient background.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d1b"/><stop offset=".52" stop-color="#14162f"/><stop offset="1" stop-color="#0a1925"/></linearGradient>
